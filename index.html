<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Çalışma Planı</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1d29;--mu:#6b7080;--ac:#4f46e5;--ac2:#e0e7ff;--ok:#16a34a;--bad:#dc2626;--bd:#e4e6ee}
@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#181b25;--tx:#e8eaf2;--mu:#8e94a8;--ac:#818cf8;--ac2:#25284a;--ok:#4ade80;--bad:#f87171;--bd:#272b3a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,sans-serif;padding-bottom:84px}
#app{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
h2{margin:4px 0 10px;font-size:20px}
h3{margin:0 0 8px;font-size:16px}
button{font:inherit;border:0;border-radius:10px;padding:8px 12px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:var(--ac2);color:var(--ac)}
button.d{background:transparent;color:var(--bad);padding:4px 8px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;width:100%}
input[type=checkbox]{width:22px;height:22px;flex:none}
input[type=range]{padding:0}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
.mu{color:var(--mu);font-size:13px}
.blk{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.blk:last-child{border:0}
.done .t{text-decoration:line-through;opacity:.55}
.bar{height:8px;background:var(--ac2);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ac)}
#tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;background:none;color:var(--mu);padding:8px 0;font-size:10px;border-radius:0}
#tabs button.on{color:var(--ac)}
#tabs b{display:block;font-size:18px;font-weight:400}
#modal{display:none;position:fixed;inset:0;background:#0008;z-index:9;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#modal .box{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cell{padding:8px 0;border-radius:10px;font-size:14px;position:relative;cursor:pointer}
.cell.today{background:var(--ac2);color:var(--ac);font-weight:700}
.cell.ev::after{content:'';position:absolute;bottom:2px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--bad)}
.big{font-size:56px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
img.pg{width:100%;border-radius:10px;margin-top:8px}
.wrap{flex-wrap:wrap}
.stat{flex:1;min-width:130px}
.stat b{font-size:22px;display:block}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs"></nav>
<div id="modal"></div>

<script>
/* ---------- Yardımcılar ---------- */
const KEY='calisma_plani_v1';
const $=id=>document.getElementById(id);
const DAYS=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const MON=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const mondayOf=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return fmt(d)};
const today=()=>fmt(new Date());
const fd=s=>{const d=parse(s);return pad(d.getDate())+'.'+pad(d.getMonth()+1)};
const dow=s=>(parse(s).getDay()+6)%7;
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mins=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};
const dur=b=>Math.max(0,mins(b.end)-mins(b.start));
const hm=m=>Math.floor(m/60)+' sa '+(m%60)+' dk';
const hrs=m=>(m/60).toFixed(1)+' sa';
const net=(d,y)=>(+d||0)-(+y||0)/4;
const G=a=>a.map(t=>({id:uid(),text:t,done:false}));

/* ---------- Veri ---------- */
function defaults(){
  const T=(day,start,end,subject,topic='')=>({id:uid(),day,start,end,subject,topic});
  return{
    tpl:[
      T(0,'19:30','21:00','Paragraf ve Türkçe'),
      T(1,'19:30','21:00','TYT Matematik','3 video'),
      T(2,'18:15','19:45','Biyoloji','AYT tekrar'),
      T(3,'19:30','21:00','TYT Matematik'),
      T(4,'19:30','21:00','AYT Matematik'),
      T(5,'14:00','16:00','TYT Matematik','Ödev'),
      T(6,'14:00','16:00','Kimya','AYT + istatistik soru')
    ],
    blocks:[],
    goals:{
      '2026-09-21':G(['TYT Matematik Köklü İfadeler her kaynaktan bitecek','TYT Kimya ilk konular bitecek','TYT Geometri başlanacak','AYT konuları programa göre tekrar edilecek']),
      '2026-09-28':G(['TYT Matematik Sayı Kümeleri bitecek','AYT tekrarları yapılacak','TYT Kimya düzene sokulacak','Paragraf çözülecek']),
      '2026-10-05':G(['TYT Matematik EBOB-EKOK gelecek','AYT Geometri tekrar edilecek','AYT Biyoloji tekrar','DAGIS çalışılacak','Kimya çalışılacak'])
    },
    events:[{id:uid(),date:'2026-10-23',type:'Deneme',title:'Özdebir TYT Denemesi'}],
    denemes:[],energy:{},extra:[],images:[],pomo:{work:25,brk:5}
  };
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S=defaults();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}
  catch(e){alert('Kayıt başarısız: depolama dolmuş olabilir. Bazı görselleri sil veya yedek al.')}
}

/* ---------- Durum ---------- */
let tab='bugun',curDay=today(),curWk=mondayOf(today()),sWk=mondayOf(today());
let cal=new Date();cal.setDate(1);
let denType='TYT';
const SEC={TYT:[['Türkçe',40],['Sosyal',20],['Matematik',40],['Fen',20]],AYT:[['Matematik',40],['Fizik',14],['Kimya',13],['Biyoloji',13]]};
const TABS=[['bugun','📅','Bugün'],['hafta','🗓️','Hafta'],['takvim','🎯','Takvim'],['odak','⏱️','Odak'],['deneme','📝','Deneme'],['stat','📊','İstatistik'],['prog','🖼️','Program']];

/* ---------- Hesaplamalar ---------- */
function dayMin(d){
  let m=0;
  S.blocks.filter(b=>b.date===d).forEach(b=>{
    if(b.actual!=null&&b.actual!=='')m+=+b.actual;
    else if(b.done)m+=dur(b);
  });
  S.extra.filter(e=>e.date===d).forEach(e=>m+=e.min);
  return m;
}
function wkMin(m){
  let a=0,wd=0,we=0;
  for(let i=0;i<7;i++){const x=dayMin(addDays(m,i));a+=x;if(i<5)wd+=x;else we+=x}
  return{a,wd,we};
}
function nextEvent(){
  const t=today();
  const e=[...S.events].filter(x=>x.date>=t).sort((a,b)=>a.date.localeCompare(b.date))[0];
  if(!e)return null;
  return{title:e.title,left:Math.round((parse(e.date)-parse(t))/864e5)};
}
const totalNet=x=>x.res.reduce((a,r)=>a+net(r.d,r.y),0);

/* ---------- Grafikler ---------- */
function barChart(items){
  const W=320,H=140,mx=Math.max(1,...items.map(i=>i.v)),bw=W/items.length;
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%">`+items.map((it,i)=>{
    const h=(it.v/mx)*90,x=i*bw+bw*.15,cx=x+bw*.35;
    return`<rect x="${x}" y="${105-h}" width="${bw*.7}" height="${h}" rx="4" fill="var(--ac)"/>
    <text x="${cx}" y="${100-h}" font-size="10" text-anchor="middle" fill="var(--tx)">${it.v?it.v.toFixed(1):''}</text>
    <text x="${cx}" y="122" font-size="10" text-anchor="middle" fill="var(--mu)">${it.l}</text>`;
  }).join('')+'</svg>';
}
function lineChart(p,mxv){
  if(!p.length)return'<p class="mu">Henüz veri yok.</p>';
  const W=320,H=170,L=30,R=10,T=14,B=28;
  const mx=mxv||Math.max(1,...p.map(x=>x.v))*1.15;
  const X=i=>p.length===1?(L+W-R)/2:L+i*(W-L-R)/(p.length-1);
  const Y=v=>H-B-(v/mx)*(H-B-T);
  let g='';
  for(let k=0;k<=4;k++){const v=mx*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)"/><text x="${L-4}" y="${Y(v)+3}" font-size="9" text-anchor="end" fill="var(--mu)">${Math.round(v)}</text>`}
  const step=Math.ceil(p.length/8);
  const pts=p.map((x,i)=>X(i)+','+Y(x.v)).join(' ');
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%">${g}<polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2.5"/>`+
  p.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="3.5" fill="var(--ac)"/>`+
    (i%step===0||i===p.length-1?`<text x="${X(i)}" y="${Y(x.v)-7}" font-size="9" text-anchor="middle" fill="var(--tx)">${x.v.toFixed(1).replace('.0','')}</text><text x="${X(i)}" y="${H-12}" font-size="9" text-anchor="middle" fill="var(--mu)">${x.l}</text>`:'')
  ).join('')+'</svg>';
}

/* ---------- Ortak parçalar ---------- */
function blockRow(b,showDate){
  return`<div class="blk ${b.done?'done':''}">
  <input type="checkbox" ${b.done?'checked':''} onchange="tog('${b.id}')">
  <div style="flex:1" onclick="editBlock('${b.id}')">
    <div class="t"><b>${esc(b.subject)}</b>${b.topic?' · '+esc(b.topic):''}</div>
    <div class="mu">${showDate?DAYS[dow(b.date)]+' · ':''}${b.start}–${b.end}</div>
  </div>
  <input type="number" min="0" placeholder="${dur(b)}" value="${b.actual??''}" style="width:64px" onchange="setAct('${b.id}',this.value)"><span class="mu">dk</span>
  </div>`;
}
function tog(id){const b=S.blocks.find(x=>x.id===id);b.done=!b.done;save();render()}
function setAct(id,v){const b=S.blocks.find(x=>x.id===id);b.actual=v===''?null:+v;save();render()}
function openModal(h){$('modal').innerHTML=`<div class="box">${h}</div>`;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show');$('modal').innerHTML=''}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ---------- BUGÜN ---------- */
function vBugun(){
  const bl=S.blocks.filter(b=>b.date===curDay).sort((a,b)=>a.start.localeCompare(b.start));
  const d=parse(curDay),en=S.energy[curDay]||'';
  const nx=nextEvent();
  return`${nx?`<div class="card"><b>${esc(nx.title)}</b> · ${nx.left===0?'Bugün!':nx.left+' gün kaldı'}</div>`:''}
  <div class="row sp"><button class="g" onclick="goDay(-1)">‹</button>
  <h2 style="margin:0;text-align:center">${d.getDate()} ${MON[d.getMonth()]}<br><span class="mu">${DAYS[dow(curDay)]}</span></h2>
  <button class="g" onclick="goDay(1)">›</button></div>
  ${curDay!==today()?`<div style="text-align:center;margin-top:8px"><button class="g" onclick="curDay=today();render()">Bugüne dön</button></div>`:''}
  <div class="card" style="margin-top:12px">
    <div class="row sp"><h3>Plan</h3><span class="mu">Çalışılan: ${hm(dayMin(curDay))}</span></div>
    ${bl.length?bl.map(b=>blockRow(b)).join(''):'<p class="mu">Bu gün için blok yok.</p>'}
    <button style="margin-top:10px" onclick="editBlock(null,'${curDay}')">+ Blok ekle</button>
  </div>
  <div class="card"><h3>Enerji: <span id="en">${en||'-'}</span>/10</h3>
  <input type="range" min="1" max="10" value="${en||5}" oninput="document.getElementById('en').textContent=this.value" onchange="setEnergy(this.value)"></div>`;
}
function goDay(n){curDay=addDays(curDay,n);render()}
function setEnergy(v){S.energy[curDay]=+v;save()}

/* ---------- Blok formu ---------- */
function subjectList(){
  const base=['Matematik','Geometri','Kimya','Biyoloji','Fizik','Türkçe','Paragraf','Tarih','Coğrafya','Felsefe','Edebiyat'];
  return[...new Set([...base,...S.blocks.map(b=>b.subject),...S.tpl.map(b=>b.subject)])];
}
function editBlock(id,date,isT){
  const src=isT?S.tpl:S.blocks;
  const b=id?src.find(x=>x.id===id):{subject:'',topic:'',start:'19:30',end:'21:00',date:date,day:0};
  openModal(`<h3>${id?'Düzenle':'Yeni blok'}${isT?' (şablon)':''}</h3>
  ${isT?`<label>Gün</label><select id="f_day">${DAYS.map((n,i)=>`<option value="${i}" ${b.day==i?'selected':''}>${n}</option>`).join('')}</select>`
       :`<label>Tarih</label><input type="date" id="f_date" value="${b.date}">`}
  <label>Ders</label><input id="f_sub" list="subs" value="${esc(b.subject)}">
  <datalist id="subs">${subjectList().map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
  <label>Konu / not</label><input id="f_top" value="${esc(b.topic)}">
  <div class="row"><div style="flex:1"><label>Başlangıç</label><input type="time" id="f_s" value="${b.start}"></div>
  <div style="flex:1"><label>Bitiş</label><input type="time" id="f_e" value="${b.end}"></div></div>
  ${!isT&&id?'<p class="mu">Bu değişiklik sadece bu bloğu etkiler (şablon değişmez).</p>':''}
  <div class="row" style="margin-top:14px">
    <button onclick="saveBlock('${id||''}',${!!isT})">Kaydet</button>
    <button class="g" onclick="${isT?'openTpl()':'closeModal()'}">İptal</button>
    ${id?`<button class="d" onclick="delBlock('${id}',${!!isT})">Sil</button>`:''}
  </div>`);
}
function saveBlock(id,isT){
  const subject=$('f_sub').value.trim();
  if(!subject){alert('Ders adı gir.');return}
  const f={subject,topic:$('f_top').value.trim(),start:$('f_s').value||'19:30',end:$('f_e').value||'21:00'};
  if(isT)f.day=+$('f_day').value;else f.date=$('f_date').value||curDay;
  const src=isT?S.tpl:S.blocks;
  if(id)Object.assign(src.find(x=>x.id===id),f);
  else src.push(Object.assign({id:uid()},f,isT?{}:{done:false,actual:null}));
  save();
  if(isT)openTpl();else closeModal();
  render();
}
function delBlock(id,isT){
  if(!confirm('Silinsin mi?'))return;
  if(isT)S.tpl=S.tpl.filter(x=>x.id!==id);else S.blocks=S.blocks.filter(x=>x.id!==id);
  save();
  if(isT)openTpl();else closeModal();
  render();
}
function openTpl(){
  const l=[...S.tpl].sort((a,b)=>a.day-b.day||a.start.localeCompare(b.start));
  openModal(`<h3>Haftalık şablon</h3><p class="mu">Varsayılan haftan. "Şablondan doldur" ile haftalara kopyalanır.</p>
  ${l.map(t=>`<div class="blk" onclick="editBlock('${t.id}',null,true)"><div style="flex:1"><b>${DAYS[t.day]}</b> · ${esc(t.subject)}${t.topic?' · '+esc(t.topic):''}<div class="mu">${t.start}–${t.end}</div></div>›</div>`).join('')||'<p class="mu">Şablon boş.</p>'}
  <div class="row" style="margin-top:12px"><button onclick="editBlock(null,null,true)">+ Ekle</button><button class="g" onclick="closeModal()">Kapat</button></div>`);
}

/* ---------- HAFTA ---------- */
function vHafta(){
  const end=addDays(curWk,6),gs=S.goals[curWk]||[],dn=gs.filter(g=>g.done).length;
  let days='';
  for(let i=0;i<7;i++){
    const d=addDays(curWk,i),bl=S.blocks.filter(b=>b.date===d).sort((a,b)=>a.start.localeCompare(b.start));
    days+=`<div class="card"><div class="row sp"><h3>${DAYS[i]} <span class="mu">${fd(d)}</span></h3><button class="g" onclick="editBlock(null,'${d}')">+</button></div>
    ${bl.length?bl.map(b=>blockRow(b)).join(''):'<div class="mu">—</div>'}</div>`;
  }
  return`<div class="row sp"><button class="g" onclick="wkNav(-1)">‹</button>
  <h2 style="margin:0">${fd(curWk)} – ${fd(end)}</h2><button class="g" onclick="wkNav(1)">›</button></div>
  <div style="text-align:center;margin:8px 0"><button class="g" onclick="curWk=mondayOf(today());render()">Bu hafta</button></div>
  <div class="card"><h3>Haftalık hedefler (${dn}/${gs.length})</h3>
  <div class="bar"><i style="width:${gs.length?dn/gs.length*100:0}%"></i></div>
  ${gs.map(g=>`<div class="blk ${g.done?'done':''}"><input type="checkbox" ${g.done?'checked':''} onchange="togGoal('${g.id}')"><div class="t" style="flex:1">${esc(g.text)}</div><button class="d" onclick="delGoal('${g.id}')">✕</button></div>`).join('')}
  <div class="row" style="margin-top:8px"><input id="ng" placeholder="Yeni hedef" onkeydown="if(event.key==='Enter')addGoal()"><button onclick="addGoal()">Ekle</button></div>
  <button class="g" style="margin-top:8px" onclick="carryGoals()">Bitmeyenleri sonraki haftaya taşı</button></div>
  <div class="card row wrap">
    <button onclick="fillTpl()">Şablondan doldur</button>
    <button class="g" onclick="copyPrev()">Geçen haftayı kopyala</button>
    <button class="g" onclick="openTpl()">Şablonu düzenle</button>
  </div>${days}`;
}
function wkNav(n){curWk=addDays(curWk,7*n);render()}
function addGoal(){const v=$('ng').value.trim();if(!v)return;(S.goals[curWk]=S.goals[curWk]||[]).push({id:uid(),text:v,done:false});save();render()}
function togGoal(id){const g=S.goals[curWk].find(x=>x.id===id);g.done=!g.done;save();render()}
function delGoal(id){S.goals[curWk]=S.goals[curWk].filter(x=>x.id!==id);save();render()}
function carryGoals(){
  const un=(S.goals[curWk]||[]).filter(g=>!g.done);
  if(!un.length){alert('Bitmemiş hedef yok.');return}
  const nk=addDays(curWk,7);
  S.goals[nk]=S.goals[nk]||[];
  un.forEach(g=>{if(!S.goals[nk].some(x=>x.text===g.text))S.goals[nk].push({id:uid(),text:g.text,done:false})});
  save();alert(un.length+' hedef sonraki haftaya taşındı.');
}
function fillTpl(){
  let n=0;
  S.tpl.forEach(t=>{
    const d=addDays(curWk,t.day);
    if(!S.blocks.some(b=>b.date===d&&b.start===t.start&&b.subject===t.subject)){
      S.blocks.push({id:uid(),date:d,start:t.start,end:t.end,subject:t.subject,topic:t.topic,done:false,actual:null});n++;
    }
  });
  save();render();
}
function copyPrev(){
  const pw=addDays(curWk,-7);
  S.blocks.filter(b=>b.date>=pw&&b.date<curWk).forEach(b=>{
    const d=addDays(b.date,7);
    if(!S.blocks.some(x=>x.date===d&&x.start===b.start&&x.subject===b.subject))
      S.blocks.push({id:uid(),date:d,start:b.start,end:b.end,subject:b.subject,topic:b.topic,done:false,actual:null});
  });
  save();render();
}

/* ---------- TAKVİM ---------- */
function vTakvim(){
  const y=cal.getFullYear(),m=cal.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
  let c=['Pt','Sa','Ça','Pe','Cu','Ct','Pz'].map(x=>`<div class="mu">${x}</div>`).join('');
  for(let i=0;i<off;i++)c+='<div></div>';
  for(let d=1;d<=n;d++){
    const ds=fmt(new Date(y,m,d));
    c+=`<div class="cell ${ds===today()?'today':''} ${S.events.some(e=>e.date===ds)?'ev':''}" onclick="curDay='${ds}';go('bugun')">${d}</div>`;
  }
  const evs=[...S.events].sort((a,b)=>a.date.localeCompare(b.date));
  return`<div class="row sp"><button class="g" onclick="calNav(-1)">‹</button><h2 style="margin:0">${MON[m]} ${y}</h2><button class="g" onclick="calNav(1)">›</button></div>
  <div class="card grid7" style="margin-top:12px">${c}</div>
  <div class="card"><h3>Hedefler ve denemeler</h3>
  ${evs.map(e=>{
    const left=Math.round((parse(e.date)-parse(today()))/864e5);
    return`<div class="blk" style="${left<0?'opacity:.5':''}"><div style="flex:1"><b>${esc(e.title)}</b><div class="mu">${e.type} · ${fd(e.date)}.${parse(e.date).getFullYear()}</div></div>
    <span class="mu">${left<0?'geçti':left===0?'bugün':left+' gün'}</span><button class="d" onclick="delEvent('${e.id}')">✕</button></div>`;
  }).join('')||'<p class="mu">Henüz eklenmedi.</p>'}
  </div>
  <div class="card"><h3>Yeni ekle</h3>
  <label>Başlık</label><input id="ev_t" placeholder="Örn. Özdebir AYT Denemesi">
  <div class="row"><div style="flex:1"><label>Tarih</label><input type="date" id="ev_d" value="${today()}"></div>
  <div style="flex:1"><label>Tür</label><select id="ev_k"><option>Deneme</option><option>Sınav</option><option>Hedef</option></select></div></div>
  <button style="margin-top:10px" onclick="addEvent()">Ekle</button></div>`;
}
function calNav(n){cal=new Date(cal.getFullYear(),cal.getMonth()+n,1);render()}
function addEvent(){
  const t=$('ev_t').value.trim();if(!t){alert('Başlık gir.');return}
  S.events.push({id:uid(),title:t,date:$('ev_d').value||today(),type:$('ev_k').value});save();render();
}
function delEvent(id){if(!confirm('Silinsin mi?'))return;S.events=S.events.filter(e=>e.id!==id);save();render()}

/* ---------- ODAK (Pomodoro) ---------- */
const P={mode:'work',left:S.pomo.work*60,run:false,end:0,t:null,sel:'',free:'',cnt:0};
let AC=null;
const mmss=s=>pad(Math.floor(s/60))+':'+pad(s%60);
function beep(){
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    [0,.4,.8].forEach(t=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.connect(g);g.connect(AC.destination);o.frequency.value=880;
      g.gain.setValueAtTime(.2,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+.3);
      o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.3);
    });
  }catch(e){}
  if(navigator.vibrate)navigator.vibrate([300,100,300]);
}
function pStart(){
  if(P.run)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}
  P.run=true;P.end=Date.now()+P.left*1000;P.t=setInterval(pTick,250);render();
}
function pPause(){
  if(!P.run)return;
  P.left=Math.max(0,Math.round((P.end-Date.now())/1000));
  P.run=false;clearInterval(P.t);render();
}
function pTick(){
  const l=Math.round((P.end-Date.now())/1000);
  if(l<=0){pDone();return}
  P.left=l;
  const el=$('ptime');if(el)el.textContent=mmss(l);
}
function pDone(){
  clearInterval(P.t);P.run=false;beep();
  if(P.mode==='work'){logFocus(S.pomo.work);P.cnt++;P.mode='break';P.left=S.pomo.brk*60}
  else{P.mode='work';P.left=S.pomo.work*60}
  render();
}
function logFocus(m){
  const b=P.sel?S.blocks.find(x=>x.id===P.sel):null;
  if(b)b.actual=(+b.actual||0)+m;
  else S.extra.push({date:today(),min:m,subject:P.free||'Serbest'});
  save();
}
function pReset(){clearInterval(P.t);P.run=false;P.left=(P.mode==='work'?S.pomo.work:S.pomo.brk)*60;render()}
function pSkip(){clearInterval(P.t);P.run=false;P.mode=P.mode==='work'?'break':'work';P.left=(P.mode==='work'?S.pomo.work:S.pomo.brk)*60;render()}
function pSet(){
  S.pomo.work=Math.max(1,+$('pw').value||25);S.pomo.brk=Math.max(1,+$('pb').value||5);save();
  if(!P.run)P.left=(P.mode==='work'?S.pomo.work:S.pomo.brk)*60;
  render();
}
function vOdak(){
  const opts=S.blocks.filter(b=>b.date===today()&&!b.done).sort((a,b)=>a.start.localeCompare(b.start))
    .map(b=>`<option value="${b.id}" ${P.sel===b.id?'selected':''}>${b.start} · ${esc(b.subject)}${b.topic?' · '+esc(b.topic):''}</option>`).join('');
  return`<h2>Odak</h2>
  <div class="card"><div class="mu" style="text-align:center">${P.mode==='work'?'Çalışma':'Mola'}</div>
  <div class="big" id="ptime">${mmss(P.left)}</div>
  <div class="row" style="justify-content:center">
    ${P.run?'<button onclick="pPause()">Duraklat</button>':'<button onclick="pStart()">Başlat</button>'}
    <button class="g" onclick="pReset()">Sıfırla</button><button class="g" onclick="pSkip()">Atla</button>
  </div>
  <p class="mu" style="text-align:center">Bu oturumda tamamlanan: ${P.cnt}</p></div>
  <div class="card"><label>Çalışma süresi hangi bloğa yazılsın?</label>
  <select onchange="P.sel=this.value"><option value="">Serbest çalışma</option>${opts}</select>
  <label>Serbest ise ders adı</label><input value="${esc(P.free)}" oninput="P.free=this.value" list="subs2">
  <datalist id="subs2">${subjectList().map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
  <div class="row"><div style="flex:1"><label>Çalışma (dk)</label><input type="number" id="pw" value="${S.pomo.work}"></div>
  <div style="flex:1"><label>Mola (dk)</label><input type="number" id="pb" value="${S.pomo.brk}"></div></div>
  <button class="g" style="margin-top:10px" onclick="pSet()">Süreleri kaydet</button>
  <p class="mu">Çalışma süresi bitince otomatik kaydedilir ve istatistiklere eklenir. Sayaç çalışırken ekranı açık tut.</p></div>`;
}

/* ---------- DENEME ---------- */
function vDeneme(){
  const sec=SEC[denType];
  const list=S.denemes.filter(x=>x.type===denType).sort((a,b)=>a.date.localeCompare(b.date));
  const pts=list.map(x=>({l:fd(x.date),v:totalNet(x)}));
  return`<h2>Deneme sonuçları</h2>
  <div class="card"><div class="row">
    <button class="${denType==='TYT'?'':'g'}" onclick="denType='TYT';render()">TYT</button>
    <button class="${denType==='AYT'?'':'g'}" onclick="denType='AYT';render()">AYT</button></div>
  <h3 style="margin-top:12px">Net grafiği</h3>${lineChart(pts)}</div>
  <div class="card"><h3>Yeni sonuç (${denType})</h3>
  <div class="row"><div style="flex:2"><label>Deneme adı</label><input id="dn_name" placeholder="Özdebir TYT"></div>
  <div style="flex:1"><label>Tarih</label><input type="date" id="dn_date" value="${today()}"></div></div>
  ${sec.map((s,i)=>`<div class="row" style="margin-top:8px"><div style="width:80px"><b>${s[0]}</b><div class="mu">/${s[1]}</div></div>
    <input type="number" min="0" max="${s[1]}" id="dd${i}" placeholder="Doğru" oninput="calcNet()">
    <input type="number" min="0" max="${s[1]}" id="dy${i}" placeholder="Yanlış" oninput="calcNet()">
    <span id="dnet${i}" style="width:48px;text-align:right">0</span></div>`).join('')}
  <h3 style="margin-top:12px">Toplam net: <span id="dtot">0</span></h3>
  <button onclick="saveDeneme()">Kaydet</button></div>
  <div class="card"><h3>Geçmiş</h3>
  ${[...list].reverse().map(x=>`<div class="blk"><div style="flex:1"><b>${esc(x.name)}</b> <span class="mu">${fd(x.date)}</span>
    <div class="mu">${x.res.map(r=>r.n+': '+net(r.d,r.y).toFixed(2).replace(/\.?0+$/,'')).join(' · ')}</div></div>
    <b>${totalNet(x).toFixed(2).replace(/\.?0+$/,'')}</b><button class="d" onclick="delDeneme('${x.id}')">✕</button></div>`).join('')||'<p class="mu">Henüz sonuç yok.</p>'}
  </div>`;
}
function calcNet(){
  let t=0;
  SEC[denType].forEach((s,i)=>{
    const n=net($('dd'+i).value,$('dy'+i).value);t+=n;
    $('dnet'+i).textContent=n.toFixed(2).replace(/\.?0+$/,'')||'0';
  });
  $('dtot').textContent=t.toFixed(2).replace(/\.?0+$/,'')||'0';
}
function saveDeneme(){
  const sec=SEC[denType],res=[];
  for(let i=0;i<sec.length;i++){
    const d=+$('dd'+i).value||0,y=+$('dy'+i).value||0;
    if(d+y>sec[i][1]){alert(sec[i][0]+': doğru + yanlış '+sec[i][1]+' soruyu geçemez.');return}
    res.push({n:sec[i][0],d,y});
  }
  S.denemes.push({id:uid(),type:denType,name:$('dn_name').value.trim()||'Deneme',date:$('dn_date').value||today(),res});
  save();render();
}
function delDeneme(id){if(!confirm('Silinsin mi?'))return;S.denemes=S.denemes.filter(x=>x.id!==id);save();render()}

/* ---------- İSTATİSTİK ---------- */
function vStat(){
  const w=wkMin(sWk),end=addDays(sWk,6);
  const daily=[];for(let i=0;i<7;i++)daily.push({l:['Pt','Sa','Ça','Pe','Cu','Ct','Pz'][i],v:dayMin(addDays(sWk,i))/60});
  const weekly=[];for(let i=7;i>=0;i--){const m=addDays(sWk,-7*i);weekly.push({l:fd(m),v:wkMin(m).a/60})}
  const ens=[];for(let i=0;i<7;i++){const e=S.energy[addDays(sWk,i)];if(e)ens.push(e)}
  const avgEn=ens.length?(ens.reduce((a,b)=>a+b,0)/ens.length).toFixed(1):'-';
  const ep=[];for(let i=29;i>=0;i--){const d=addDays(today(),-i);if(S.energy[d])ep.push({l:fd(d),v:S.energy[d]})}
  const gs=S.goals[sWk]||[],gd=gs.filter(g=>g.done).length;
  return`<div class="row sp"><button class="g" onclick="sWk=addDays(sWk,-7);render()">‹</button>
  <h2 style="margin:0">${fd(sWk)} – ${fd(end)}</h2><button class="g" onclick="sWk=addDays(sWk,7);render()">›</button></div>
  <div class="row wrap" style="margin:12px 0">
    <div class="card stat"><span class="mu">Haftalık toplam</span><b>${hrs(w.a)}</b></div>
    <div class="card stat"><span class="mu">Hafta içi ort. (gün)</span><b>${hrs(w.wd/5)}</b></div>
    <div class="card stat"><span class="mu">Hafta sonu ort. (gün)</span><b>${hrs(w.we/2)}</b></div>
    <div class="card stat"><span class="mu">Ortalama enerji</span><b>${avgEn}/10</b></div>
    <div class="card stat"><span class="mu">Hedefler</span><b>${gd}/${gs.length}</b></div>
  </div>
  <div class="card"><h3>Günlük çalışma (saat)</h3>${barChart(daily)}</div>
  <div class="card"><h3>Son 8 hafta (saat)</h3>${barChart(weekly)}</div>
  <div class="card"><h3>Enerji (son 30 gün)</h3>${lineChart(ep,10)}</div>`;
}

/* ---------- PROGRAM (okul programı görselleri + yedek) ---------- */
function vProg(){
  return`<h2>Okul programı</h2>
  <div class="card"><label>Görsel yükle (ders programı fotoğrafı vb.)</label><input type="file" accept="image/*" onchange="addImg(this)"></div>
  ${S.images.map(im=>`<div class="card"><div class="row sp"><b>${esc(im.title)}</b><button class="d" onclick="delImg('${im.id}')">Sil</button></div>
  <img class="pg" src="${im.data}" onclick="viewImg('${im.id}')"></div>`).join('')}
  <div class="card"><h3>Yedek</h3><div class="row wrap"><button onclick="exportData()">Yedeği indir</button></div>
  <label>Yedekten geri yükle</label><input type="file" accept="application/json" onchange="importData(this)">
  <p class="mu">Veriler bu cihazın tarayıcısında saklanır. Düzenli yedek almanı öneririm.</p></div>`;
}
function addImg(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const s=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      S.images.push({id:uid(),title:f.name.replace(/\.[^.]+$/,''),data:c.toDataURL('image/jpeg',.75)});
      save();render();
    };
    im.src=r.result;
  };
  r.readAsDataURL(f);
}
function delImg(id){if(!confirm('Görsel silinsin mi?'))return;S.images=S.images.filter(i=>i.id!==id);save();render()}
function viewImg(id){const im=S.images.find(i=>i.id===id);openModal(`<img src="${im.data}" style="width:100%"><button class="g" style="margin-top:10px" onclick="closeModal()">Kapat</button>`)}
function exportData(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
  a.download='calisma-plani-yedek.json';a.click();
}
function importData(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o.blocks||!o.tpl)throw 0;
      S=Object.assign(defaults(),o);save();render();alert('Yedek yüklendi.');
    }catch(e){alert('Geçersiz yedek dosyası.')}
  };
  r.readAsText(f);
}

/* ---------- Ana çizim ---------- */
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){
  const V={bugun:vBugun,hafta:vHafta,takvim:vTakvim,odak:vOdak,deneme:vDeneme,stat:vStat,prog:vProg};
  $('app').innerHTML=V[tab]();
  $('tabs').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('');
}
render();
</script>
</body>
